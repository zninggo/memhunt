name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl-tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test
        run: cargo run --release --target ${{ matrix.target }} -- --version
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="memhunt-${VERSION}-${{ matrix.target }}"
          mkdir "${STAGE}"
          cp "target/${{ matrix.target }}/release/memhunt" README.md LICENSE "${STAGE}/"
          tar czf "${STAGE}.tar.gz" "${STAGE}"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $Stage = "memhunt-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory $Stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/memhunt.exe", README.md, LICENSE $Stage
          Compress-Archive -Path $Stage -DestinationPath "$Stage.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: memhunt-${{ matrix.target }}
          path: memhunt-*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: memhunt-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum memhunt-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            memhunt-*
            SHA256SUMS
