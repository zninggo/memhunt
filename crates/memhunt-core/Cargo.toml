[package]
name = "memhunt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory-dump key hunting engine: oracle-driven sliding-window search for AES keys"

[dependencies]
aes = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
base64 = "0.22"
