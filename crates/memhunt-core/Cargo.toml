[package]
name = "memhunt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Memory-dump key hunting engine: oracle-driven search for block-cipher keys, hash preimages, HMAC keys, and AES key schedules"

[dependencies]
aes = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
des = "0.9.0"
sm4 = "0.6.0"
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
sm3 = "0.5.0"
hmac = "0.13.0"
digest = "0.11"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }

[dev-dependencies]
base64 = "0.22"
des = "0.9"
sm4 = "0.6"
