[package]
name = "memhunt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hunt AES/DES/3DES/SM4 keys, hash preimages, HMAC secrets, and key schedules in memory dumps from a known ciphertext (CLI)"

[[bin]]
name = "memhunt"
path = "src/main.rs"

[dependencies]
memhunt-core = { path = "../memhunt-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
rayon = "1"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
aes = "0.8"
hex = "0.4"
